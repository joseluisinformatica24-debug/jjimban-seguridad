services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - red_interna

  api:
    build: ./api
    networks:
      - red_interna
    # No exponemos puertos al host

  redis:
    image: redis:alpine
    networks:
      - red_interna
    # No exponemos puertos al host

networks:
  red_interna:
    driver: bridge
